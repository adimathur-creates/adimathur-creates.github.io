<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samjho History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1b18;--muted:#6b665d;--line:#e4dfd5;--accent:#0f5c4d;--warn:#9a5b00;--warn-bg:#fbefd9;--bad:#b3261e;--bad-bg:#fbe5e3;--ok:#1f7a4d;--ok-bg:#e5f3ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
header b{font:600 24px/1 'Source Serif 4',Georgia,serif}header span{color:var(--muted);font-size:13px}header a{margin-left:auto;color:var(--accent);font-weight:600;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px 20px;display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pill{padding:2px 9px;border-radius:99px;font-weight:600;font-size:11px;background:#f1eee7}
.pill.approved{background:var(--ok-bg);color:var(--ok)}.pill.review{background:#ece6f8;color:#5b3fa0}.pill.active,.pill.paused{background:#e8f3f0;color:var(--accent)}.pill.cancelled{background:var(--bad-bg);color:var(--bad)}
.rep{background:var(--warn-bg);color:var(--warn)}
.prob{font-weight:600;margin:6px 0}
.tried{font-size:13px;color:var(--muted)}
details{margin-top:6px;font-size:13px}summary{cursor:pointer;color:var(--accent);font-weight:600}
li{margin:3px 0}.k{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-right:6px}
.theme{display:inline-block;margin:3px;padding:3px 9px;border-radius:8px;background:#f1eee7;font-size:13px}.theme b{color:var(--accent)}
.side li{font-size:13px}.empty{color:var(--muted);text-align:center;padding:30px}
</style></head><body>
<header><b>Samjho</b><span>interview history log: every conversation, saved</span><a href="./">Open live console</a></header>
<main>
<section><input id="q" placeholder="Search past interviews (e.g. hisaab, staff, udhaar, Soundbox)"><div id="list"><div class="empty">Loading...</div></div></section>
<aside class="side">
<div class="card"><h2>Recurring problems</h2><div id="themes"></div></div>
<div class="card"><h2>Already tried before (don't repeat)</h2><ul id="tried"></ul></div>
<div class="card"><h2>Totals</h2><div id="totals" class="row"></div></div>
</aside>
</main>
<script>
(function(){
var SB='https://fbwfxbubrxpbfzwmbhrk.supabase.co/rest/v1/rpc/get_history';
var KEY='sb_publishable_6lYpdTHtU13mb96w58xhHg_g65qVUTr';
var data=[];var STOP={the:1,and:1,a:1,an:1,of:1,to:1,in:1,is:1,are:1,was:1,they:1,their:1,he:1,his:1,she:1,her:1,it:1,for:1,with:1,on:1,at:1,by:1,from:1,that:1,this:1,every:1,shop:1,owner:1,has:1,have:1,had:1,be:1,or:1,not:1,no:1,but:1,when:1,them:1,does:1,do:1,did:1,there:1,which:1,as:1,about:1,into:1,after:1,before:1,than:1,also:1,very:1,some:1,one:1,two:1,day:1,days:1,time:1,uses:1,use:1,runs:1,run:1,own:1,himself:1,herself:1,themselves:1,personally:1,store:1,kirana:1};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function words(t){return (String(t||'').toLowerCase().match(/[a-z]{4,}/g)||[]).filter(function(w){return !STOP[w]})}
function when(d){return new Date(d).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function render(){
 var term=document.getElementById('q').value.trim().toLowerCase();
 var sets=data.map(function(s){var w={};words(s.problem).forEach(function(x){w[x]=1});return w});
 var html=data.filter(function(s){return !term||JSON.stringify(s).toLowerCase().indexOf(term)>=0}).map(function(s){
  var i=data.indexOf(s),me=sets[i],match=null;
  for(var j=i+1;j<data.length;j++){var c=0;for(var w in me){if(sets[j][w])c++}if(c>=2){match=data[j];break}}
  var items=(s.items||[]).map(function(it){return '<li><span class="k">'+esc(it.kind)+'</span>'+esc(it.text)+'</li>'}).join('');
  return '<div class="card"><div class="row"><span>'+when(s.created_at)+'</span><span class="pill '+esc(s.status)+'">'+esc(s.status)+'</span><span>'+s.turns+' turns</span>'+(match?'<span class="pill rep">Seen before: similar to '+when(match.created_at)+'</span>':'')+'</div>'+
   '<div class="prob">'+esc(s.problem||'(no problem statement captured)')+'</div>'+
   (s.tried?'<div class="tried">Already tried: '+esc(s.tried)+'</div>':'')+
   '<details><summary>Full brief ('+(s.items||[]).length+' lines)</summary><ul>'+items+'</ul></details></div>';
 }).join('');
 document.getElementById('list').innerHTML=html||'<div class="empty">No past interviews yet.</div>';
 var freq={};data.forEach(function(s,i){for(var w in sets[i]){freq[w]=(freq[w]||0)+1}});
 var top=Object.keys(freq).filter(function(w){return freq[w]>1}).sort(function(a,b){return freq[b]-freq[a]}).slice(0,12);
 document.getElementById('themes').innerHTML=top.length?top.map(function(w){return '<span class="theme">'+esc(w)+' <b>x'+freq[w]+'</b></span>'}).join(''):'<span class="row">Appears after a few interviews.</span>';
 var tried=[];data.forEach(function(s){(s.items||[]).forEach(function(it){if((it.q==='tried'||it.q==='current_fix')&&it.kind!=='gap')tried.push('<li>'+esc(it.text)+' <span class="row">('+when(s.created_at)+')</span></li>')})});
 document.getElementById('tried').innerHTML=tried.slice(0,15).join('')||'<li class="row">Nothing recorded yet.</li>';
 var approved=data.filter(function(s){return s.status==='approved'}).length;
 document.getElementById('totals').innerHTML='<span class="pill">'+data.length+' interviews</span><span class="pill approved">'+approved+' approved</span>';
}
function load(){if(document.hidden)return;fetch(SB,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:'{}'}).then(function(r){return r.json()}).then(function(d){data=Array.isArray(d)?d:[];render()}).catch(function(){document.getElementById('list').innerHTML='<div class="empty">Could not load history. Refresh.</div>'})}
document.getElementById('q').addEventListener('input',render);
load();setInterval(load,60000);
})();
</script></body></html>
